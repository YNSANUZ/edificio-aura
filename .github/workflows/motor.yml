# Roda o motor do Edifício Aura sozinho, sem depender de nenhum PC.
# Cada execução fica ~5h50 no ar rodando 1 ciclo a cada 10 minutos (lê os comentários do
# @comenteaura, aplica as regras, publica os dados no site e guarda a memória no ramo "motor").
# No fim ela chama a próxima execução, formando uma corrente contínua.
# O agendamento (cron) é só reserva: se a corrente quebrar, ele religa.
# Para PARAR a corrente: cancele a execução em andamento na aba Actions.
name: Motor do Edifício Aura

on:
  schedule:
    - cron: "7 */3 * * *"   # reserva: tenta religar a cada 3 horas
  workflow_dispatch: {}      # botão "Run workflow" (e a própria corrente) usa isto

concurrency:
  group: motor-aura
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixa o site publicado
        uses: actions/checkout@v4
        with:
          ref: main
          path: publicado

      - name: Baixa o motor e a memória do prédio
        uses: actions/checkout@v4
        with:
          ref: motor
          path: motor-ramo

      - name: Roda os ciclos (a cada 10 min, por ~5h50)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          AURA_SEGREDO: ${{ secrets.AURA_SEGREDO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_DM_TOKEN: ${{ secrets.IG_DM_TOKEN }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          AURA_SEM_PUBLICAR: "1"
          AURA_DEPLOY: ${{ github.workspace }}/publicado
          TZ: America/Sao_Paulo
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "Falta o segredo IG_TOKEN no repositório."; exit 1; fi
          RAIZ="$GITHUB_WORKSPACE"
          for r in publicado motor-ramo; do
            git -C "$RAIZ/$r" config user.name "motor-aura[bot]"
            git -C "$RAIZ/$r" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          done
          FIM=$(( $(date +%s) + 350*60 ))
          while :; do
            INICIO=$(date +%s)
            echo "::group::Ciclo $(date +%H:%M)"
            cd "$RAIZ/motor-ramo/motor"
            umask 077
            printf 'IG_TOKEN=%s\nIG_USER_ID=me\nIG_TOKEN_RENOVADO_EM=\n' "$IG_TOKEN" > .env
            python3 rodar.py --uma-vez || echo "ciclo falhou, tenta de novo no próximo"
            rm -f .env
            python3 publicar.py --dados || echo "publicação falhou, tenta no próximo"
            tail -n 2 dados/log.txt || true
            cd "$RAIZ/motor-ramo"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Estado do prédio $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q origin HEAD:motor || echo "não consegui guardar o estado agora"
            fi
            echo "::endgroup::"
            PROXIMO=$(( INICIO + 600 ))
            if [ $PROXIMO -ge $FIM ]; then break; fi
            ESPERA=$(( PROXIMO - $(date +%s) ))
            if [ $ESPERA -gt 0 ]; then sleep $ESPERA; fi
          done

      - name: Chama a próxima execução (corrente)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run motor.yml -R "$GITHUB_REPOSITORY" --ref main
